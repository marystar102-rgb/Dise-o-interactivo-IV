<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acertijo de Diálogos</title>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:Verdana, sans-serif;
    text-align:center;
}

#gameContainer{
    width:1300px;
    margin:10px auto;
    position:relative;
}

#escena{
    width:100%;
    display:block;
}

/* GLOBOS */

.board{
    position:absolute;
    display:grid;
    grid-template-columns:repeat(2, 110px);
    grid-template-rows:repeat(2, 70px);
    gap:4px;
}

/* Ajusta si lo necesitas */

#board1{
    left:150px;
    top:100px;
}

#board2{
    left:560px;
    top:120px;
}

#board3{
    left:970px;
    top:130px;
}

.slot{
    width:110px;
    height:70px;

    background:transparent;

    border:none;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:18px;
}

/* PIEZAS */

#piecesPool{

    margin-top:20px;

    display:flex;
    flex-wrap:wrap;

    justify-content:center;

    gap:10px;

    padding:20px;

    background:white;

    border-top:3px solid #ccc;
}

.piece{

    width:110px;
    min-height:70x;

    background:transparent;

    border:none;

    border-radius:0;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:5px;

    cursor:grab;

    box-sizing:border-box;

    font-size:18px;
}

/* NUMEROS */

.number{

    display:none;

    position:absolute;

    font-size:60px;
    font-weight:bold;

    color:green;
}

#num1{
    left:180px;
    top:340px;
}

#num2{
    left:560px;
    top:340px;
}

#num3{
    left:930px;
    top:340px;
}

#codigo{

    display:none;

    margin-top:20px;

    font-size:60px;

    font-weight:bold;

    color:green;
}

.pista{

    position:absolute;

    width:260px;

    text-align:center;

    font-family:"Trebuchet MS", sans-serif;

    font-size:22px;

    font-weight:bold;

    color:#222;

}

#pista1{
    left:100px;
    top:680px;
    width:400px;

    padding-left:20px;
    padding-right:20px;

    box-sizing:border-box;
}

#pista2{
    left:550px;
    top:680px;
}

#pista3{
    left:900px;
    top:680px;
}

</style>
</head>
<body>

<div id="gameContainer">

<img
id="escena"
src="Assets_scaperoom/Bocetos/puzzle1-dialogos/fondo-tres-hablando-globos-de-texto-gris.png"
alt="Fondo">

<div id="board1" class="board"></div>
<div id="board2" class="board"></div>
<div id="board3" class="board"></div>

<div id="num1" class="number">4</div>
<div id="num2" class="number">7</div>
<div id="num3" class="number">9</div>

<div id="pista1" class="pista">
    Comunicación por medios no institucionales
</div>

<div id="pista2" class="pista">
    Ganarse la confianza del alumnado
</div>

<div id="pista3" class="pista">
    Preferencia por ciertos alumnos
</div>

</div>

<div id="piecesPool"></div>

<div id="codigo">
🔓 CÓDIGO: 479
</div>

<script>

const puzzles = [

{
board:"board1",
number:"num1",
frases:[
"¿No les parece raro",
"que sea la única",
"clase con grupo",
"de WhatsApp?"
]
},

{
board:"board2",
number:"num2",
frases:[
"No lo sé, pero",
"me regaló un sándwich.",
"¡Qué buena",
"onda!"
]
},

{
board:"board3",
number:"num3",
frases:[
"Me dio la impresión",
"de que tiene",
"preferencia por",
"las alumnas."
]
}

];

function mezclar(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];
}

return array;
}

function crearPuzzle(puzzle,index){

const board=document.getElementById(puzzle.board);

for(let i=0;i<4;i++){

const slot=document.createElement("div");

slot.className="slot";

slot.dataset.position=i;

slot.addEventListener("dragover",e=>{
e.preventDefault();
});

slot.addEventListener("drop",e=>{

e.preventDefault();

const id=e.dataTransfer.getData("pieza");

const pieza=document.getElementById(id);

const origen=pieza.parentElement;

if(slot.children.length===0){

slot.appendChild(pieza);

}else{

const existente=slot.children[0];

origen.appendChild(existente);

slot.appendChild(pieza);

}

revisarPuzzle(puzzle);

});

board.appendChild(slot);
}

let piezas=[];

for(let i=0;i<4;i++){

piezas.push({
texto:puzzle.frases[i],
correcta:i
});

}

mezclar(piezas);

piezas.forEach(pieza=>{

const div=document.createElement("div");

div.className="piece";

div.textContent=pieza.texto;

div.draggable=true;

div.dataset.correct=pieza.correcta;

div.id="pieza_"+index+"_"+pieza.correcta;

div.addEventListener("dragstart",e=>{

e.dataTransfer.setData(
"pieza",
div.id
);

});

document
.getElementById("piecesPool")
.appendChild(div);

});

}

function revisarPuzzle(puzzle){

const slots=document.querySelectorAll(
"#"+puzzle.board+" .slot"
);

let correcto=true;

slots.forEach((slot,pos)=>{

if(slot.children.length===0){

correcto=false;
return;
}

const pieza=slot.children[0];

if(Number(pieza.dataset.correct)!==pos){

correcto=false;
}

});

if(correcto){

document.getElementById(
puzzle.number
).style.display="block";

comprobarFinal();
}

}

function comprobarFinal(){

const completo =

document.getElementById("num1").style.display==="block"
&&
document.getElementById("num2").style.display==="block"
&&
document.getElementById("num3").style.display==="block";

if(completo){

document.getElementById("codigo")
.style.display="block";

}

}

const pool=document.getElementById("piecesPool");

pool.addEventListener("dragover",e=>{
e.preventDefault();
});

pool.addEventListener("drop",e=>{

e.preventDefault();

const id=e.dataTransfer.getData("pieza");

const pieza=document.getElementById(id);

pool.appendChild(pieza);

});

puzzles.forEach((p,i)=>{

crearPuzzle(p,i);

});

</script>

</body>
</html>
