<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point & Click</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

/* PAREDES */

.pared{
    position:relative;
    width:100vw;
    height:100vh;
    display:none;
}

.pared img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* SOLO PROFESOR */

#hoverWall{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;

    opacity:0;
    transition:.25s;

    pointer-events:none;
}

#escritorioHover{
    position:absolute;

    left:25%;
    bottom:15%;

    width:50%;
    height:25%;

    cursor:pointer;
}

/* ESCRITORIO */

#vistaEscritorio{

    display:none;

    position:absolute;

    top:0;
    left:0;

    width:100vw;
    height:100vh;
}

#vistaEscritorio img{

    width:100%;
    height:100%;

    object-fit:cover;
}

#volver{

    position:absolute;

    top:20px;
    left:20px;

    z-index:5000;

    padding:10px 20px;

    cursor:pointer;
}


/* FLECHAS */

#izq,
#der{

    position:fixed;

    top:50%;

    transform:translateY(-50%);

    width:70px;
    height:70px;

    background:rgba(0,0,0,.7);

    border:2px solid white;

    color:white;

    font-size:30px;

    cursor:pointer;

    z-index:9999;
}

#izq{
    left:20px;
}

#der{
    right:20px;
}

#vistaCasilleros{

    display:none;

    position:absolute;

    top:0;
    left:0;

    width:100vw;
    height:100vh;
}

#vistaCasilleros img{

    width:100%;
    height:100%;

    object-fit:cover;
}

#volverCasilleros{

    position:absolute;

    top:20px;
    left:20px;

    z-index:5000;

    padding:10px 20px;

    cursor:pointer;
}

#hoverWallCasilleros{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    transition:.25s;

    pointer-events:none;
}

#casilleroHover{

    position:absolute;

    left:60%;
    top:10%;

    width:20%;
    height:70%;

    cursor:pointer;
}

#intro{

    position:fixed;

    inset:0;

    z-index:20000;

    background:black;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}

#introImg{

    width:100%;
    height:100%;

    object-fit:contain;
}

#siguiente{

    position:absolute;

    bottom:25px;

    right:25px;

    padding:12px 25px;

    font-size:20px;

    cursor:pointer;
}

</style>
</head>

<body>

<div id="intro">

    <img id="introImg"
         src="Assets_scaperoom/Bocetos/cutscene/1-comic-inicio.png">

    <button id="siguiente">
        →
    </button>

</div>

<div id="juego" style="display:none;">

<!-- PROFESOR -->
<div id="paredProfesor" class="pared">

    <img
        src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-pared1-escritorio.png"
        id="baseWall"
    >

    <img
        src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-pared1-escritorio-hover.png"
        id="hoverWall"
    >

    <div id="escritorioHover"></div>

</div>

<!-- CASILLEROS -->

<div id="paredCasilleros" class="pared">

    <img
        src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-pared2-casilleros.png"
        id="baseWallCasilleros"
    >

    <img
        src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-pared2-casilleros-hover.png"
        id="hoverWallCasilleros"
    >

    <div id="casilleroHover"></div>

</div>

<!-- FRISO -->

<div id="paredFriso" class="pared">

    <img src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-friso-cerrado.png">

</div>

<!-- PUERTA -->

<div id="paredPuerta" class="pared">

    <img src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-pared3-puerta-cerrada.png">

</div>

<!-- ESCRITORIO -->

<div id="vistaEscritorio">

    <button id="volver">← Volver</button>

    <img src="escritorio_puzzle.png">

</div>

<div id="vistaCasilleros">

    <button id="volverCasilleros">
        ← Volver
    </button>

    <img
        src="Assets_scaperoom/Bocetos/Fondos/Habitacion1/habitacion1-pared2-casilleros-ventana-telefono.png"
    >

</div>
<!-- FLECHAS -->

<button id="izq">◀</button>
<button id="der">▶</button>

<script>

const imagenesIntro = [

    "Assets_scaperoom/Bocetos/cutscene/2-comic-inicio.png",
    "Assets_scaperoom/Bocetos/cutscene/3-comic-inicio.png",
    "Assets_scaperoom/Bocetos/cutscene/4-comic-inicio.png",
    "Assets_scaperoom/Bocetos/cutscene/5-comic-inicio.png"
];

let paginaActual = 0;

const intro =
document.getElementById("intro");

const introImg =
document.getElementById("introImg");

const botonSiguiente =
document.getElementById("siguiente");

botonSiguiente.addEventListener(
"click",
()=>{

    paginaActual++;

    if(
       paginaActual <
       imagenesIntro.length
    ){

        introImg.src =
        imagenesIntro[paginaActual];

    }else{

    intro.style.display = "none";

    document.getElementById("juego")
    .style.display = "block";

    mostrarPared();

    }

});

/* PAREDES */

let paredActual = 0;

const paredes = [

    document.getElementById("paredProfesor"),
    document.getElementById("paredCasilleros"),
    document.getElementById("paredFriso"),
    document.getElementById("paredPuerta")

];

function mostrarPared(){

    paredes.forEach(p=>{

        p.style.display="none";

    });

    paredes[paredActual].style.display="block";

}

mostrarPared();

/* GIRAR DERECHA */

document
.getElementById("der")
.addEventListener("click",()=>{

    paredActual++;

    if(paredActual > 3){

        paredActual = 0;

    }

    mostrarPared();

});

/* GIRAR IZQUIERDA */

document
.getElementById("izq")
.addEventListener("click",()=>{

    paredActual--;

    if(paredActual < 0){

        paredActual = 3;

    }

    mostrarPared();

});

/* HOVER ESCRITORIO */

const hitbox =
document.getElementById("escritorioHover");

const hover =
document.getElementById("hoverWall");

const hoverCasilleros =
document.getElementById(
"hoverWallCasilleros"
);

const hitboxCasilleros =
document.getElementById(
"casilleroHover"
);

const vistaCasilleros =
document.getElementById(
"vistaCasilleros"
);

hitbox.addEventListener("mouseenter",()=>{

    hover.style.opacity="1";

});

hitbox.addEventListener("mouseleave",()=>{

    hover.style.opacity="0";

});

hitboxCasilleros.addEventListener(
"mouseenter",
()=>{

    hoverCasilleros.style.opacity="1";

});

hitboxCasilleros.addEventListener(
"mouseleave",
()=>{

    hoverCasilleros.style.opacity="0";

});

/* ENTRAR ESCRITORIO */

hitbox.addEventListener("click",()=>{

    document.getElementById("vistaEscritorio")
    .style.display="block";

    paredes[paredActual].style.display="none";

    document.getElementById("izq")
    .style.display="none";

    document.getElementById("der")
    .style.display="none";

});

hitboxCasilleros.addEventListener(
"click",
()=>{

    vistaCasilleros.style.display =
    "block";

    paredes[paredActual].style.display =
    "none";

    document.getElementById("izq")
    .style.display="none";

    document.getElementById("der")
    .style.display="none";

});

/* VOLVER */

document
.getElementById("volver")
.addEventListener("click",()=>{

    document.getElementById("vistaEscritorio")
    .style.display="none";

    mostrarPared();

    document.getElementById("izq")
    .style.display="block";

    document.getElementById("der")
    .style.display="block";

});

document
.getElementById("volverCasilleros")
.addEventListener("click",()=>{

    vistaCasilleros.style.display =
    "none";

    mostrarPared();

    document.getElementById("izq")
    .style.display="block";

    document.getElementById("der")
    .style.display="block";

});

</script>

</div>
</body>
</html>
