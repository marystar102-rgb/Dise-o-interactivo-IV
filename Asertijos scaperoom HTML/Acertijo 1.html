<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle de Diálogos</title>

<style>

body{
    margin:0;
    background:#edf2f7;
    font-family:Arial,sans-serif;
    text-align:center;
}

#gameContainer{
    position:relative;
    width:1200px;
    margin:20px auto;
}

#escena{
    width:100%;
    display:block;
}

/* POSICIÓN DE LOS 3 PUZZLES */

#board1{
    position:absolute;
    left:100px;
    top:75px;
}

#board2{
    position:absolute;
    left:470px;
    top:80px;
}

#board3{
    position:absolute;
    left:835px;
    top:70px;
}

.board{
    display:grid;
    grid-template-columns:repeat(2,120px);
    grid-template-rows:repeat(2,60px);
    gap:2px;
}

.slot{
    width:120px;
    height:60px;
    border:2px dashed rgba(255,255,255,.6);
    background:rgba(255,255,255,.15);
}

.piece{
    width:120px;
    height:60px;
    cursor:grab;
    border-radius:6px;
}

#piecesPool{
    margin-top:25px;

    display:grid;
    grid-template-columns:repeat(6,120px);
    gap:10px;

    justify-content:center;

    padding:20px;

    background:white;
    border:2px solid #ccc;
}

.number{
    display:none;

    position:absolute;

    font-size:48px;
    font-weight:bold;

    color:#00aa33;
}

/* posición de números */

#num1{
    top:300px;
    left:175px;
}

#num2{
    top:300px;
    left:550px;
}

#num3{
    top:300px;
    left:920px;
}

#codigo{
    display:none;
    margin-top:25px;

    font-size:55px;
    font-weight:bold;
    color:#00aa33;
}

</style>
</head>

<body>

<div id="gameContainer">

<img
id="escena"
src="fondo-tres-hablando-globos-de-texto-gris.png"
>

<div id="board1" class="board"></div>
<div id="board2" class="board"></div>
<div id="board3" class="board"></div>

<div id="num1" class="number">4</div>
<div id="num2" class="number">7</div>
<div id="num3" class="number">9</div>

</div>

<div id="piecesPool"></div>

<div id="codigo">
🔓 CÓDIGO: 479
</div>

<script>

const puzzles = [

{
board:"board1",
number:"num1",
image:"Asertijos scaperoom HTML/globo-3-whatsapp.png"
},

{
board:"board2",
number:"num2",
image:"globo-2-snadwich.png" 
},

{
board:"board3",
number:"num3",
image:"Assets_scaperoom/Bocetos/puzzle1-dialogos/globo-3-preferencia-alumnas-pensamientos.png"
}

];

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;
}

function crearPuzzle(puzzle,index){

const board=document.getElementById(puzzle.board);

const imagen=new Image();

imagen.onload=function(){

const piezas=[];

const anchoPieza=120;
const altoPieza=60;

for(let i=0;i<4;i++){

const fila=Math.floor(i/2);
const columna=i%2;

const canvas=document.createElement("canvas");

canvas.width=anchoPieza;
canvas.height=altoPieza;

const ctx=canvas.getContext("2d");

ctx.drawImage(
imagen,
columna*(imagen.width/2),
fila*(imagen.height/2),
imagen.width/2,
imagen.height/2,
0,
0,
anchoPieza,
altoPieza
);

piezas.push({
id:i,
src:canvas.toDataURL()
});

}

for(let i=0;i<4;i++){

const slot=document.createElement("div");

slot.className="slot";
slot.dataset.position=i;

slot.addEventListener("dragover",e=>{
e.preventDefault();
});

slot.addEventListener("drop",e=>{

e.preventDefault();

const data=JSON.parse(
e.dataTransfer.getData("text")
);

const dragged=document.getElementById(data.id);

const origen=dragged.parentElement;

if(slot.children.length===0){

slot.appendChild(dragged);

}else{

const existente=slot.children[0];

origen.appendChild(existente);

slot.appendChild(dragged);

}

revisarPuzzle(index,puzzle);

});

board.appendChild(slot);
}

shuffle(piezas).forEach(pieza=>{

const img=document.createElement("img");

img.src=pieza.src;
img.className="piece";
img.draggable=true;

img.dataset.correct=pieza.id;

img.id=`pieza_${index}_${pieza.id}`;

img.addEventListener("dragstart",e=>{

e.dataTransfer.setData(
"text",
JSON.stringify({
id:img.id
})
);

});

document
.getElementById("piecesPool")
.appendChild(img);

});

};

imagen.src=puzzle.image;

}

function revisarPuzzle(index,puzzle){

const slots=document.querySelectorAll(
"#"+puzzle.board+" .slot"
);

let correcto=true;

slots.forEach((slot,pos)=>{

if(slot.children.length===0){

correcto=false;
return;
}

const pieza=slot.children[0];

if(Number(pieza.dataset.correct)!==pos){

correcto=false;
}

});

if(correcto){

document.getElementById(
puzzle.number
).style.display="block";

comprobarFinal();
}

}

function comprobarFinal(){

const terminado=

document.getElementById("num1").style.display==="block" &&
document.getElementById("num2").style.display==="block" &&
document.getElementById("num3").style.display==="block";

if(terminado){

document.getElementById(
"codigo"
).style.display="block";

}

}

const pool=document.getElementById("piecesPool");

pool.addEventListener("dragover",e=>{
e.preventDefault();
});

pool.addEventListener("drop",e=>{

e.preventDefault();

const data=JSON.parse(
e.dataTransfer.getData("text")
);

const dragged=document.getElementById(data.id);

pool.appendChild(dragged);

});

puzzles.forEach((p,i)=>{
crearPuzzle(p,i);
});

</script>

</body>
</html>
