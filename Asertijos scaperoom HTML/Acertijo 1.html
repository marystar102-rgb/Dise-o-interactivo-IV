<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acertijo de Diálogos</title>

<style>

body{
    margin:0;
    background:#ececec;
    font-family:Arial,sans-serif;
    text-align:center;
}

#gameContainer{
    width:1200px;
    margin:20px auto;
    position:relative;
}

#escena{
    width:100%;
    display:block;
}

/* GLOBOS */

.board{
    position:absolute;

    display:grid;
    grid-template-columns:repeat(2,160px);
    grid-template-rows:repeat(2,70px);

    gap:4px;
}

#board1{
    left:40px;
    top:40px;
}

#board2{
    left:430px;
    top:40px;
}

#board3{
    left:800px;
    top:40px;
}

.slot{
    width:160px;
    height:70px;

    border:2px dashed rgba(0,0,0,.4);

    background:rgba(255,255,255,.4);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:18px;
    text-align:center;
}

/* PIEZAS */

#piecesPool{

    margin-top:20px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:10px;

    background:white;

    padding:20px;

    border-top:3px solid #ccc;
}

.piece{

    width:160px;
    height:70px;

    background:white;

    border:2px solid #444;

    border-radius:10px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:5px;

    cursor:grab;

    font-size:18px;
}

.number{

    display:none;

    position:absolute;

    color:green;

    font-size:60px;

    font-weight:bold;
}

#num1{
    left:150px;
    top:330px;
}

#num2{
    left:540px;
    top:330px;
}

#num3{
    left:915px;
    top:330px;
}

#codigo{

    display:none;

    margin-top:20px;

    font-size:60px;

    color:green;

    font-weight:bold;
}

</style>
</head>
<body>

<div id="gameContainer">

<img
id="escena"
src="fondo-tres-hablando-globos-de-texto-gris.png">

<div id="board1" class="board"></div>
<div id="board2" class="board"></div>
<div id="board3" class="board"></div>

<div id="num1" class="number">4</div>
<div id="num2" class="number">7</div>
<div id="num3" class="number">9</div>

</div>

<div id="piecesPool"></div>

<div id="codigo">
🔓 CÓDIGO: 479
</div>

<script>

const puzzles = [

{
board:"board1",
number:"num1",
pieces:[
"¿No les parece raro",
"que sea la única",
"clase con grupo",
"de WhatsApp?"
]
},

{
board:"board2",
number:"num2",
pieces:[
"No lo sé, pero",
"me regaló un sándwich.",
"¡Qué buena",
"onda!"
]
},

{
board:"board3",
number:"num3",
pieces:[
"Me dio la impresión",
"de que tiene",
"preferencia por",
"las alumnas."
]
}

];

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];
}

return array;
}

function crearPuzzle(puzzle,index){

const board=document.getElementById(puzzle.board);

for(let i=0;i<4;i++){

const slot=document.createElement("div");

slot.className="slot";

slot.dataset.position=i;

slot.addEventListener("dragover",(e)=>{
e.preventDefault();
});

slot.addEventListener("drop",(e)=>{

e.preventDefault();

const id=e.dataTransfer.getData("pieza");

const pieza=document.getElementById(id);

const origen=pieza.parentElement;

if(slot.children.length===0){

slot.appendChild(pieza);

}else{

const existente=slot.children[0];

origen.appendChild(existente);

slot.appendChild(pieza);

}

revisarPuzzle(puzzle);

});

board.appendChild(slot);
}

let piezas=[];

for(let i=0;i<4;i++){

piezas.push({

correct:i,
texto:puzzle.pieces[i]

});

}

shuffle(piezas);

piezas.forEach((pieza)=>{

const div=document.createElement("div");

div.className="piece";

div.draggable=true;

div.id=`pieza_${index}_${pieza.correct}`;

div.dataset.correct=pieza.correct;

div.textContent=pieza.texto;

div.addEventListener("dragstart",(e)=>{

e.dataTransfer.setData(
"pieza",
div.id
);

});

document
.getElementById("piecesPool")
.appendChild(div);

});

}

function revisarPuzzle(puzzle){

const slots=document.querySelectorAll(
"#"+puzzle.board+" .slot"
);

let correcto=true;

slots.forEach((slot,pos)=>{

if(slot.children.length===0){

correcto=false;
return;
}

const pieza=slot.children[0];

if(Number(pieza.dataset.correct)!==pos){

correcto=false;
}

});

if(correcto){

document
.getElementById(puzzle.number)
.style.display="block";

comprobarFinal();

}

}

function comprobarFinal(){

if(

document.getElementById("num1").style.display==="block"
&&
document.getElementById("num2").style.display==="block"
&&
document.getElementById("num3").style.display==="block"

){

document
.getElementById("codigo")
.style.display="block";

}

}

const pool=document.getElementById("piecesPool");

pool.addEventListener("dragover",(e)=>{
e.preventDefault();
});

pool.addEventListener("drop",(e)=>{

e.preventDefault();

const id=e.dataTransfer.getData("pieza");

const pieza=document.getElementById(id);

pool.appendChild(pieza);

});

puzzles.forEach((p,i)=>{

crearPuzzle(p,i);

});

</script>

</body>
</html>
