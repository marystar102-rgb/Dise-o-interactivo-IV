<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 en Línea</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#111827;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

#instructions{
    max-width:800px;
    margin:0 auto 20px;
    padding:15px;
    background:#1f2937;
    border:2px solid #374151;
    border-radius:12px;
}

#status{
    font-size:20px;
    margin-bottom:15px;
}

#board{
    display:grid;
    grid-template-columns:repeat(6,70px);
    gap:5px;
    justify-content:center;
}

.cell{
    width:70px;
    height:70px;
    background:#1f2937;
    border:2px solid #374151;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    background:#2d3b55;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#f39c12;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#e67e22;
}

svg{
    pointer-events:none;
}
</style>
</head>
<body>

<div id="instructions">
    🎯 Consigue <strong class="___1qwroh2 fl43uef f19n0e5" data-lexical-text="true">4 fichas seguidas</strong>
    en horizontal, vertical o diagonal para ganar.
</div>

<div id="status">
    Nivel 1 - Tu turno
</div>

<div id="board"></div>

<button onclick="location.reload()">
    Reiniciar partida
</button>

<script>

const SIZE = 6;
const WIN = 4;

let board = Array(SIZE*SIZE).fill("");
let playerTurn = true;
let level = 1;
let playerMoves = 0;
let gameOver = false;

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");

function createBoard(){

    for(let i=0;i<SIZE*SIZE;i++){

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;

        cell.addEventListener("click",()=>{
            playerMove(i);
        });

        boardElement.appendChild(cell);
    }
}

function playerMove(index){

    if(gameOver) return;
    if(!playerTurn) return;
    if(board[index] !== "") return;

    placeMark(index,"X");

    playerMoves++;

    if(checkWinner("X") && level < 3){
    winScreen();
    return;
     }

    if(playerMoves === 2 && level === 1){

        level = 2;

        statusElement.innerHTML =
        "⚠ Nivel 2: El profesor juega dos veces por turno";
    }
    else if(playerMoves === 3 && level === 2){

        level = 3;

        statusElement.innerHTML =
        "⚠ Nivel 3: El profesor juega tres veces por turno";
    }

    playerTurn = false;

    setTimeout(cpuTurn,600);
}

function placeMark(index,mark){

    board[index] = mark;

    const cell =
    document.querySelector(`[data-index="${index}"]`);

    if(mark === "X"){

        cell.innerHTML = `
        <svg width="42" height="42" viewBox="0 0 64 64">
            <circle cx="32" cy="10" r="7" fill="#F3F4F6"/>
            <path d="
                M32 19
                L20 42
                L28 42
                L28 58
                L36 58
                L36 42
                L44 42
                Z"
                fill="#F3F4F6"/>
            <rect x="18" y="22" width="5" height="16" fill="#F3F4F6"/>
            <rect x="41" y="22" width="5" height="16" fill="#F3F4F6"/>
        </svg>`;
    }
    else{

        cell.innerHTML = `
        <svg width="42" height="42" viewBox="0 0 64 64">
            <circle cx="32" cy="10" r="7" fill="#F3F4F6"/>

            <rect x="24" y="20"
                  width="16" height="22"
                  fill="#F3F4F6"/>

            <rect x="25" y="42"
                  width="5" height="16"
                  fill="#F3F4F6"/>

            <rect x="34" y="42"
                  width="5" height="16"
                  fill="#F3F4F6"/>

            <rect x="16" y="22"
                  width="8" height="5"
                  fill="#F3F4F6"/>

            <rect x="40" y="22"
                  width="8" height="5"
                  fill="#F3F4F6"/>
        </svg>`;
    }
}

function cpuTurn(){

    if(gameOver) return;

    let cpuMoves;

    if(level === 1){
        cpuMoves = 1;
    }
    else if(level === 2){
        cpuMoves = 2;
    }
    else{
        cpuMoves = 3;
    }

    function doMove(moveNumber){

        if(gameOver) return;

        const move = chooseBestMove();

        if(move === null){
            return;
        }

        placeMark(move,"O");

        if(checkWinner("O")){

    if(level === 3){

        gameOver = "pending";

    }else{

        gameOver = true;

        statusElement.innerHTML = `
            <div style="color:#ff5555;font-size:28px;font-weight:bold;">
                Has perdido
            </div>

            <div style="font-size:90px;margin-top:10px;">
                🗝️
            </div>

            <div style="font-size:20px;">
                Premio de consolación:
                Llave misteriosa
            </div>
        `;

        return;
    }
}

        if(moveNumber < cpuMoves - 1){

            setTimeout(()=>{
                doMove(moveNumber + 1);
            },500);
}else{

    if(gameOver === "pending"){

        gameOver = true;

        statusElement.innerHTML = `
            <div style="color:#ff5555;font-size:28px;font-weight:bold;">
                Has perdido
            </div>

            <div style="font-size:90px;margin-top:10px;">
                🗝️
            </div>

            <div style="font-size:20px;">
                Premio de consolación:
                Llave misteriosa
            </div>
        `;

        return;
    }

    playerTurn = true;

    statusElement.textContent =
    `Nivel ${level} - Tu turno`;
}
    }

    doMove(0);
}

function chooseBestMove(){

    let empty = [];

    for(let i=0;i<board.length;i++){
        if(board[i] === ""){
            empty.push(i);
        }
    }

    if(empty.length === 0){
        return null;
    }

    for(let i of empty){

        board[i] = "O";

        if(checkWinner("O")){
            board[i] = "";
            return i;
        }

        board[i] = "";
    }

    for(let i of empty){

        board[i] = "X";

        if(checkWinner("X")){
            board[i] = "";
            return i;
        }

        board[i] = "";
    }

    const preferred = [
        14,15,20,21,
        13,16,19,22,
        8,9,10,11
    ];

    for(let pos of preferred){

        if(board[pos] === ""){
            return pos;
        }
    }

    return empty[Math.floor(Math.random()*empty.length)];
}

function checkWinner(symbol){

    const dirs = [
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE;c++){

            for(let [dr,dc] of dirs){

                let count = 0;

                for(let k=0;k<WIN;k++){

                    const nr = r + dr*k;
                    const nc = c + dc*k;

                    if(
                        nr < 0 || nr >= SIZE ||
                        nc < 0 || nc >= SIZE
                    ){
                        break;
                    }

                    if(board[nr*SIZE+nc] === symbol){
                        count++;
                    }
                }

                if(count === WIN){
                    return true;
                }
            }
        }
    }

    return false;
}

function winScreen(){

    gameOver = true;

    statusElement.innerHTML = `
        <div style="color:#4ade80;font-size:28px;font-weight:bold;">
            ¡Has ganado!
        </div>
    `;
}

createBoard();
</script>

</body>
</html>
